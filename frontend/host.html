<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Party - Host Control</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="host-container">
        <!-- Main Content -->
        <main class="host-main">
            <!-- Player Section -->
            <div class="player-section">
                <!-- YouTube Player -->
                <div id="player">
                    <video id="host-video" controls autoplay muted playsinline poster="" preload="auto"></video>
                </div>

                <!-- Player Controls -->
                <div class="player-controls">
                    <button id="skip-button" class="btn btn-danger">Skip Video</button>
                </div>

                <!-- Current Video Info -->
                <div id="current-info" class="current-info">
                    <h2>Now Playing</h2>
                    <div class="video-title">Loading...</div>
                    <div class="added-by">Please wait</div>
                </div>
            </div>

            <!-- Queue Sidebar -->
            <aside class="queue-sidebar">
                <h2>Up Next (<span id="queue-count" class="queue-count">0</span>)</h2>
                <div id="queue-list" class="host-queue-list">
                    <div class="loading">Loading queue</div>
                </div>
            </aside>
        </main>

        <!-- Footer with Connection Info -->
        <footer class="host-footer">
            <div class="connection-info">
                <div class="info-item">
                    <div class="label">Guest Access URL</div>
                    <div class="value" id="server-url">Loading...</div>
                </div>
            </div>

            <div class="qr-code-container">
                <img id="qr-code" src="/api/qrcode" alt="QR Code for Guest Access">
                <p>Scan to join on mobile</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" integrity="sha256-5XU7EPxl6uNfIYg+aE0ixDzmbelo01FmeSWFubij8aI=" crossorigin="anonymous"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
